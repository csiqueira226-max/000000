<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meliponário Cambará</title>
    <!-- Link para os ícones funcionarem -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* CONFIGURAÇÕES GERAIS (CSS) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9f9; /* var(--bg-light) */
            color: #333;               /* var(--text-main) */
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-left h1 {
            color: #d4af37;
            font-size: 24px;
        }

        .social-icons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .social-icons a {
            text-decoration: none;
            font-size: 20px;
            transition: 0.3s;
        }

        .instagram { color: #E1306C; }
        .youtube { color: #FF0000; }
        
        .cart-icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            position: relative;
        }

        .cart-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: red;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 12px;
        }

        .logo-img {
            height: 50px;
            border-radius: 50%;
        }

        .frete-info {
            text-align: center;
            padding: 10px;
            background: #fffbe6;
            color: #d4af37;
            font-weight: bold;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

    <!-- INFORMAÇÃO DE FRETE -->
    <div class="frete-info">
        🚚 Envio para todo o Brasil com segurança via Superfrete
    </div>

    <!-- CABEÇALHO -->
    <header>
        <div class="header-left">
            <h1>Meliponário Cambará</h1>
        </div>

        <div class="header-right">
            <div class="social-icons">
                <!-- Link Instagram -->
                <a href="https://www.instagram.com/meliponario_cambara?igsh=ejMxeDkxbT13b29v" 
                   class="instagram" target="_blank" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>

                <!-- Link YouTube -->
                <a href="https://youtube.com" 
                   class="youtube" target="_blank" aria-label="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>

                <!-- Carrinho -->
                <button class="cart-icon-btn" onclick="toggleCart()" title="Ver Carrinho">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="cart-count">0</span>
                </button>

                <!-- Logo -->
                <img src="assets/logo.jpg" alt="Logo Meliponário Cambará" class="logo-img" style="margin-left: 15px;">
            </div>
        </div>
    </header>

    <section class="banner-section container">
        <!-- Seu conteúdo do banner continua aqui -->
    </section>

    <script>
        // Função simples para o carrinho não dar erro ao clicar
        function toggleCart() {
            alert("Carrinho aberto!");
        }
    </script>
</body>
</html>
